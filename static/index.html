<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 900px;
      width: 100%;
      height: 650px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h2 {
      font-size: 24px;
      font-weight: 600;
    }
    
    .context-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    
    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f5f5f5;
    }
    
    .message {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    
    .message.user {
      align-items: flex-end;
    }
    
    .message.agent {
      align-items: flex-start;
    }
    
    .message-content {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
    }
    
    .message.user .message-content {
      background: #667eea;
      color: white;
    }
    
    .message.agent .message-content {
      background: white;
      color: #333;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    .message-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      padding: 0 8px;
    }
    
    /* Multi-tool result sections */
    .result-section {
      margin-top: 12px;
      border-left: 3px solid #667eea;
      padding-left: 10px;
    }
    
    .tool-header {
      font-size: 13px;
      color: #667eea;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .result-box {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 5px;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .result-item {
      padding: 8px;
      margin: 5px 0;
      background: white;
      border-radius: 5px;
      border-left: 2px solid #667eea;
    }
    
    .error-box {
      background: #fee;
      color: #c33;
      padding: 8px;
      border-radius: 5px;
      border-left: 3px solid #c33;
      font-size: 12px;
    }
    
    .reasoning {
      font-size: 11px;
      color: #666;
      font-style: italic;
      margin-top: 5px;
      padding: 5px;
      background: #f0f0f0;
      border-radius: 5px;
    }
    
    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }
    
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    #input:focus {
      border-color: #667eea;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .context-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
    }
    
    .modal-content h3 {
      margin-bottom: 15px;
      color: #667eea;
    }
    
    .modal-content pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>🧳 Travel Planning Agent</h2>
    <div class="context-badge" onclick="showContext()">📋 Context</div>
  </div>
  
  <div id="chat"></div>
  
  <div class="input-area">
    <input 
      id="input" 
      placeholder="Try: 'I want to travel from Amsterdam to Paris on June 12-15'"
      onkeypress="if(event.key === 'Enter') send()"
    >
    <button onclick="send()" id="sendBtn">Send</button>
  </div>
</div>

<div class="context-modal" id="contextModal" onclick="hideContext()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3>Current Context</h3>
    <pre id="contextDisplay"></pre>
    <button onclick="hideContext()">Close</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
